<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070b1a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CODEVERSE</title>
<style>
:root{--bg:#070b1a;--c1:#00e5ff;--c2:#ff2bd6;--ok:#39ff88;--gold:#ffd24a;--card:#101a38;--line:#1f2f5c;--tx:#e8f0ff;--mut:#8da2d6}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 20% 0,#14214a,#070b1a 60%) fixed;color:var(--tx);min-height:100vh;padding-bottom:84px}
#app{max-width:900px;margin:auto;padding:12px}
h2,h3{margin-bottom:8px}small,.mut{color:var(--mut)}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:900;letter-spacing:3px;color:var(--c1);text-shadow:0 0 12px var(--c1)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px;margin-left:6px;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{background:linear-gradient(135deg,var(--c1),#3b82f6);color:#001;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer;transition:.15s;box-shadow:0 0 14px #00e5ff55}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}.btn.m{background:linear-gradient(135deg,var(--c2),#8b5cf6);color:#fff;box-shadow:0 0 14px #ff2bd655}.btn:disabled{opacity:.4;box-shadow:none;cursor:default;transform:none}
.bar{height:10px;background:#0a1230;border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--ok));transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a1230ee;border-top:1px solid var(--line);backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom);z-index:5}
#nav button{flex:1;background:0;border:0;color:var(--mut);padding:7px 0;font-size:9px;cursor:pointer}#nav button b{display:block;font-size:20px;font-weight:400}#nav .on{color:var(--c1);text-shadow:0 0 8px var(--c1)}
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.hidden{display:none}
.mb{background:var(--card);border:1px solid var(--c1);box-shadow:0 0 30px #00e5ff44;border-radius:18px;padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
pre{background:#050a1c;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;white-space:pre-wrap;color:var(--ok);font-family:Consolas,monospace;margin:10px 0;font-size:14px}
.opt{display:block;width:100%;margin:6px 0;padding:11px;background:#0a1230;border:1px solid var(--line);color:var(--tx);border-radius:10px;font-size:14px;cursor:pointer;text-align:left}.opt:hover:not(:disabled){border-color:var(--c1)}
.tag{font-size:11px;background:#1b2b5e;border-radius:8px;padding:2px 8px;color:var(--c1)}
.err{color:#ff6b8a;font-weight:800;animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.map{position:relative;height:340px;border-radius:16px;border:1px solid var(--line);margin-bottom:12px;background:linear-gradient(#1a2c6a55 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,#1a2c6a55 1px,transparent 1px) 0 0/40px 40px,radial-gradient(circle,#13306b,#081028);overflow:hidden}
.node{position:absolute;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:2px solid var(--c1);background:#0a1a40;color:#fff;font-size:28px;cursor:pointer;animation:pulse 2.2s infinite}.node small{display:block;font-size:9px;color:#fff}
@keyframes pulse{50%{box-shadow:0 0 22px var(--c1)}}
.hero{text-align:center;border-width:2px}.hero .ic{font-size:38px}
.r-Common{border-color:#9ca3af}.r-Uncommon{border-color:#39ff88}.r-Rare{border-color:#3b9eff}.r-Epic{border-color:#c15bff}.r-Legendary{border-color:var(--gold);box-shadow:0 0 14px #ffd24a66}
.lock{filter:grayscale(1) brightness(.45)}
.gain{color:var(--gold);font-weight:800;font-size:18px;margin:8px 0}
.big{font-size:54px}
input,select,textarea{width:100%;padding:11px;margin:5px 0;background:#0a1230;border:1px solid var(--line);color:var(--tx);border-radius:10px;font-size:15px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tabs button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 12px;white-space:nowrap;cursor:pointer}.tabs .on{color:var(--c1);border-color:var(--c1)}
.log{font-size:13px;color:var(--mut);line-height:1.6}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid var(--c1);padding:10px 16px;border-radius:12px;z-index:20;display:none}

#arena{position:fixed;inset:0;z-index:8;background:#05070f;touch-action:none;user-select:none;-webkit-user-select:none}
#arena canvas{width:100%;height:100%;display:block}
/* ===== HUD BATTLE (gaya MOBA mobile) ===== */
#top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
#prs{display:flex;gap:22px;align-items:flex-end}
.pr{display:flex;gap:4px}
.p{position:relative;width:38px;text-align:center;background:#0b1636e6;border:2px solid #3b82f6;border-radius:9px;padding:2px 0 0;overflow:hidden;box-shadow:0 2px 8px #0009}
#pe .p{border-color:#ff4d6d}
.p b{position:absolute;left:0;top:0;background:#0b1636;color:#fff;font-size:9px;line-height:1;padding:2px 4px;border-bottom-right-radius:7px;z-index:1}
.p i{display:block;height:5px;background:linear-gradient(#8dffb0,#1fbf5b);margin:2px 0 0;transition:width .15s}
#pe .p i{background:linear-gradient(#ff9bb0,#e0344f)}
.p.dead{opacity:.35;filter:grayscale(1)}
.p.sel{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
#sb{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;border:1px solid #ffffff55;font-weight:900;box-shadow:0 2px 10px #000a;color:#fff}
#sb span{padding:1px 12px;font-size:15px;min-width:38px;text-align:center}
#kb{background:linear-gradient(#2f7bff,#0d3fa8)}#kr{background:linear-gradient(#ff4d6d,#a3112e)}
#tm{background:#0a1230f2;font-variant-numeric:tabular-nums;min-width:58px!important}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000b 100%)}
#net{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + min(176px,26vw)*.5625 + 8px);font-size:11px;color:#9dffb8;background:#0009;padding:2px 8px;border-radius:10px;pointer-events:none}
#joy{position:absolute;left:calc(26px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#ffffff0a 0,#ffffff10 60%,#ffffff2e 100%);border:3px solid #ffffff55;touch-action:none;box-shadow:inset 0 0 26px #000a}
#joy:after{content:"";position:absolute;inset:28px;border-radius:50%;border:2px dashed #ffffff30;pointer-events:none}
#knob{position:absolute;left:50px;top:50px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4efff,#3b82f6 70%);border:2px solid #fffa;box-shadow:0 0 16px #3b82f6;pointer-events:none}
.ab{position:absolute;border-radius:50%;border:3px solid #cfe3ff;background:radial-gradient(circle at 35% 30%,#2e4fa6,#0a1230 75%);color:#fff;font-weight:800;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;padding:0;cursor:pointer;overflow:hidden;box-shadow:0 0 14px #3b82f688,inset 0 0 12px #000a}
.ab>*{position:relative;z-index:1;pointer-events:none}
.ab:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#000c calc(var(--cd,0)*100%),transparent 0);pointer-events:none;z-index:2}
.ab em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:18px;color:#fff;text-shadow:0 0 6px #000,0 0 3px #000;z-index:3}
.ab.cd{filter:saturate(.35) brightness(.85)}
.nn{display:flex;flex-direction:column;align-items:center;gap:1px;max-width:92%}.nn b{font-size:22px;line-height:1;font-weight:400}.nn small{font-size:8px;color:#dbe8ff;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#bA{right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:98px;height:98px;font-size:40px;background:radial-gradient(circle at 35% 30%,#3d63c9,#10204f 75%);border-color:#7fd0ff;box-shadow:0 0 18px #3b9eff99,inset 0 0 14px #000a}
#bA:active{transform:scale(.94)}
#b1{right:calc(132px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:62px;height:62px}
#b2{right:calc(118px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom));width:62px;height:62px}
#b3{right:calc(36px + env(safe-area-inset-right));bottom:calc(132px + env(safe-area-inset-bottom));width:68px;height:68px;border-color:var(--gold);box-shadow:0 0 16px #ffd24aaa,inset 0 0 12px #000a}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:640px){.p{width:32px}#prs{gap:12px}#joy{width:128px;height:128px}#knob{left:39px;top:39px}#bA{width:84px;height:84px;font-size:34px}#b1{right:calc(114px + env(safe-area-inset-right));width:54px;height:54px}#b2{right:calc(102px + env(safe-area-inset-right));bottom:calc(88px + env(safe-area-inset-bottom));width:54px;height:54px}#b3{right:calc(30px + env(safe-area-inset-right));bottom:calc(114px + env(safe-area-inset-bottom));width:60px;height:60px}}

#gb{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
#gt{display:flex;gap:6px;align-items:center;pointer-events:auto}
#ff,#snd,#fsb{background:#0a1230e6;border:2px solid #ffffff55;border-radius:50%;width:34px;height:34px;color:#fff;font-size:16px;cursor:pointer}
#gs{background:linear-gradient(#3a2d0a,#0a0a12);border:2px solid var(--gold);color:var(--gold);border-radius:20px;padding:4px 12px;font-size:15px;font-weight:800;cursor:pointer}
#gi{display:grid;grid-template-columns:repeat(3,28px);gap:3px}#gi i{font-style:normal;width:28px;height:28px;display:grid;place-items:center;background:#0a1230e6;border:1px solid #ffd24a88;border-radius:7px;font-size:15px}.opt:disabled{opacity:.4}
#dead{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#0006;backdrop-filter:grayscale(1);-webkit-backdrop-filter:grayscale(1);color:#fff;font-size:24px;pointer-events:none}#dead span{font-size:52px;font-weight:900;color:var(--gold)}#dead small{font-size:14px;color:var(--mut)}
/* ===== QUICK ANSWER (tanpa pause) ===== */
#qa{position:absolute;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));width:min(280px,56vw);opacity:.94;background:#0a1230d9;border:2px solid var(--c1);border-radius:14px;padding:8px 10px;color:#fff;box-shadow:0 0 18px #00e5ff66;z-index:5;font-size:12px}
#qa small{color:var(--c1);font-weight:800}#qa pre{margin:4px 0;font-size:11px;max-height:90px;overflow:auto;white-space:pre-wrap}
#qa .qb{height:5px;border-radius:3px;background:#ffffff22;overflow:hidden;margin-bottom:4px}#qa .qb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd24a,#ff4d6d)}
#cb{position:absolute;left:calc(26px + env(safe-area-inset-left));bottom:calc(190px + env(safe-area-inset-bottom));padding:4px 12px;border-radius:16px;background:linear-gradient(90deg,#ff7a18,#ff2bd6);color:#fff;font-weight:900;font-size:15px;box-shadow:0 0 16px #ff7a18aa;pointer-events:none;z-index:5}
#cb.pop{animation:cbp .35s}@keyframes cbp{0%{transform:scale(1.6)}100%{transform:scale(1)}}
#qa .opt{padding:6px 8px;margin:3px 0;font-size:12px;border-radius:9px}
/* ===== SERU: banner, event, buff, sudden death ===== */
#ann{position:absolute;left:50%;top:26%;transform:translateX(-50%);padding:6px 22px;border-radius:30px;font-weight:900;font-size:clamp(16px,4.2vw,30px);letter-spacing:2px;color:#ffe27a;text-shadow:0 0 14px #ff9d2e,0 2px 0 #000;background:linear-gradient(90deg,transparent,#000a,transparent);pointer-events:none;z-index:6;white-space:nowrap;animation:annp .35s ease-out}
#ann.bad{color:#ff6b8a;text-shadow:0 0 14px #ff1744,0 2px 0 #000}#ann.ev{color:#d8b8ff;text-shadow:0 0 14px #7c3aed,0 2px 0 #000}
@keyframes annp{0%{transform:translateX(-50%) scale(1.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
#evc{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + min(176px,26vw)*.5625 + 30px);font-size:11px;font-weight:800;color:#d8b8ff;background:#0009;border:1px solid #7c3aed;padding:2px 8px;border-radius:10px;pointer-events:none}
#bf{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + min(176px,26vw)*.5625 + 54px);font-size:12px;font-weight:800;color:#ffd24a;background:#0009;padding:2px 8px;border-radius:10px;pointer-events:none;display:none}
#vig.sd{animation:sdp 1s infinite}@keyframes sdp{0%,100%{box-shadow:inset 0 0 40px #ff103000}50%{box-shadow:inset 0 0 90px #ff1030aa}}
#qc{position:absolute;left:8px;top:160px;display:none;flex-direction:column;gap:4px;z-index:5}#qc>button{width:38px;height:34px;border-radius:10px;border:2px solid var(--line);background:#0a1230cc;color:#fff;font-size:18px}#qcl{display:none;flex-direction:column;gap:4px}#qcl button{background:#0a1230ee;color:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap}
#hs{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 30% 20%,#12307a,#050914 70%);display:flex;flex-direction:column;padding:10px 14px calc(10px + env(safe-area-inset-bottom));gap:8px;overflow:auto;color:var(--tx)}#hs .hh{display:flex;justify-content:space-between;align-items:center}#hs .hm{display:flex;gap:14px;flex:1;flex-wrap:wrap;align-content:flex-start}#hs .pv{flex:1 1 260px;display:flex;flex-direction:column;align-items:center;gap:6px}#hs canvas{height:min(240px,34vh);width:auto;filter:drop-shadow(0 0 18px var(--c1))}#hs .rt{flex:1 1 300px;display:flex;flex-direction:column;gap:10px}.sk{display:flex;gap:10px;align-items:center;background:#0a1230cc;border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:left;font-size:13px}.bar{height:7px;background:#1a2447;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),#7dffa8)}#hs .hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}.hsC{cursor:pointer;padding:6px!important;text-align:center}.hsC.on{outline:2px solid var(--c1);box-shadow:0 0 14px var(--c1)}
/* ===== LOBBY ===== */
.lb{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.lbbg{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 35%,#2f55b088,transparent 62%),linear-gradient(#0e1c4a,#070b1a 75%)}
.lbbg:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff07 0 2px,transparent 2px 46px)}
.lt{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px}
.pf{display:flex;align-items:center;gap:8px;background:#0a1230cc;border:1px solid var(--line);border-radius:30px;padding:4px 12px 4px 4px;cursor:pointer}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;font-weight:900;font-size:20px;color:#001;border:2px solid var(--gold)}
.pf b{font-size:14px}.xb{height:6px;width:100px;background:#0a1230;border-radius:4px;overflow:hidden;margin-top:4px}.xb i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--ok))}
.lv{background:var(--gold);color:#001;font-weight:900;font-size:11px;border-radius:8px;padding:2px 6px}
.cur{display:flex;gap:6px;align-items:center}
.ib,.sd{position:relative;background:#0a1230cc;border:1px solid var(--line);color:var(--tx);cursor:pointer}
.ib{width:40px;height:40px;border-radius:12px;font-size:19px}
.ib u,.sd u{position:absolute;top:-5px;right:-5px;background:#ff3b5c;color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px;text-decoration:none}
.lm{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 12px;min-height:0;gap:8px}
.ls,.rs{display:flex;flex-direction:column;gap:10px;width:92px}.rs{width:190px}
.sd{border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;text-align:center}.sd span{font-size:26px}.sd small{font-size:10px;font-weight:400}
.sd.ev{border-color:var(--gold);box-shadow:0 0 14px #ffd24a44}
.ctr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.stage{position:relative;width:min(300px,60vw);height:min(300px,38vh);display:grid;place-items:center;cursor:pointer}
.aura{position:absolute;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--ac) 0,transparent 68%);opacity:.8;animation:br 3s infinite}
@keyframes br{50%{transform:scale(1.12);opacity:.5}}
.hi{position:relative;font-size:min(150px,22vh);filter:drop-shadow(0 12px 18px #000a);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.ped{position:absolute;bottom:4%;width:70%;height:18px;border-radius:50%;background:radial-gradient(var(--ac),transparent 70%)}
.np{background:linear-gradient(90deg,transparent,#0a1230ee,transparent);text-align:center;padding:6px 44px;margin-top:4px}
.np h2{margin:0;letter-spacing:2px}
.pn{background:#0a1230cc;border:1px solid var(--line);border-radius:14px;padding:8px}
.pn h4{font-size:11px;color:var(--c1);letter-spacing:2px;margin-bottom:6px}
.sr{display:flex;align-items:center;gap:8px;padding:5px;border-radius:10px;cursor:pointer;font-size:13px}.sr:hover{background:#1b2b5e}.sr i{font-style:normal;font-size:22px}.sr small{margin-left:auto}
.tip{position:absolute;right:14px;bottom:84px;background:#0a1230ee;border:1px solid var(--c1);border-radius:10px;padding:7px 12px;font-size:12px;max-width:230px;z-index:2}
.bt{display:flex;align-items:flex-end;position:relative;padding-bottom:env(safe-area-inset-bottom);background:#0a1230}
.t2{display:flex;flex:1;height:62px;border-top:1px solid var(--c1);background:linear-gradient(#101c46,#0a1230)}
.t2 button{flex:1;background:0;border:0;color:var(--tx);font-weight:700;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.t2 button span{font-size:22px}.t2 u{position:absolute;top:6px;right:22%;background:#ff3b5c;color:#fff;font-size:10px;border-radius:9px;padding:1px 5px;text-decoration:none}
.rk{width:170px;height:80px;border:0;border-radius:20px 0 0 0;background:linear-gradient(135deg,#ffe27a,#ff9d2e);color:#3a1a00;cursor:pointer;font-weight:900;box-shadow:0 0 22px #ffd24a88;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:br 2.4s infinite}
.rk b{font-size:26px;letter-spacing:3px}.rk em{font-style:normal;font-size:13px;letter-spacing:2px}.rk small{font-size:10px;color:#5a2d00}
@media(max-width:640px){.rs{display:none}.ls{width:70px}.rk{width:130px}.rk b{font-size:21px}.tip{display:none}}

/* ===== RESPONSIF HP: portrait / landscape / notch ===== */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{min-height:100vh;min-height:100dvh}
#app{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}

#jz{position:absolute;left:0;top:30%;bottom:0;width:46%}

 /* --- battle landscape HP --- */

 #hs{padding:6px 10px calc(6px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}#hs canvas{height:28vh}#hs .pv small.mut{display:none}#hs .hg{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}
 /* --- lobby & menu --- */

 .t2{height:48px}.t2 button span{font-size:18px}.rk{height:58px}.rk b{font-size:21px}.tip{display:none}
 .stage{height:min(230px,44vh)}.np{padding:2px 30px;margin-top:0}.np h2{font-size:16px}.sd{padding:5px 2px}.sd span{font-size:20px}.ls,.rs{gap:6px}
 #nav button{padding:3px 0}#nav button b{font-size:16px}body{padding-bottom:54px}
}
@media(max-height:360px){#joy{width:104px;height:104px}#knob{left:27px;top:27px}#b3{bottom:calc(94px + env(safe-area-inset-bottom))}#b2{bottom:calc(68px + env(safe-area-inset-bottom))}#qa{width:min(260px,42vw)}}
</style></head><body>
<div id="app"></div><div id="arena" class="hidden"></div><div id="modal" class="modal hidden"></div><div id="toast"></div><nav id="nav"></nav>
<script>
// ===== STATE =====
const S={token:null,view:'home',d:null,tk:null,cur:null,b:null,team:[],ia:0,it:0,lbTab:'ranked',lb:null,prof:null,teach:null,ctx:''};
try{S.token=localStorage.getItem('cv_t')}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=id=>S.d.heroes.find(h=>h.heroId===id);
const NAV=[['home','🏠','HOME'],['explore','🗺','EXPLORE'],['dex','🦸','CODEDEX'],['battle','⚔️','BATTLE'],['rank','🏆','RANK'],['quest','🎯','QUEST'],['profile','👤','PROFILE']];

// ===== API (satu pintu ke Code.gs) =====
// Isi dengan URL Web App Apps Script kamu (yang berakhiran /exec)
const API_URL='https://script.google.com/macros/s/AKfycbwQXuqgJVmGlfbkv_X-ysgl5EkOpw_ADpQ6zdMyVHYd_rvZFfgYHrxJIuJk229RK3AvtA/exec';
function call(action,p){return new Promise(res=>{
  const done=r=>{
    if(r&&r.error==='AUTH'){logout();return res(null)}
    if(r&&r.error){toast(r.error);return res(null)}
    res(r)};
  const fail=()=>{toast('Koneksi gagal, coba lagi');res(null)};
  // Di dalam Apps Script: pakai google.script.run. Di GitHub/domain sendiri: pakai fetch ke Web App.
  if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(done).withFailureHandler(fail).api(S.token,action,p||{});return}
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:S.token,action:action,p:p||{}})})
    .then(r=>r.json()).then(done).catch(fail)})}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function mod(h){const m=$('#modal');m.innerHTML='<div class="mb">'+h+'</div>';m.classList.remove('hidden')}
function closeM(){$('#modal').classList.add('hidden')}
function resM(t,t2,body){mod(`<h3 style="color:var(--ok)">${t}</h3><h2>${t2}</h2><p>${body}</p><button class="btn" onclick="closeM();paint()">OK</button>`)}

// ===== LOGIN =====
async function doLogin(){const r=await call('login',{username:$('#lu').value,code:$('#lc').value,name:$('#ln').value,kelas:$('#lk').value});
  if(!r)return;S.token=r.token;try{localStorage.setItem('cv_t',r.token)}catch(e){}S.d=r;go('home')}
function logout(){S.token=null;S.d=null;try{localStorage.removeItem('cv_t')}catch(e){}paint()}
function loginV(){return `<div class="card" style="margin-top:8vh;text-align:center"><div class="big">🧬</div><h1 class="logo" style="font-size:34px">CODEVERSE</h1><p class="mut" style="margin:6px 0 14px">Explore. Solve. Capture. Battle.</p>
<input id="lu" placeholder="Username (huruf/angka)" autocapitalize="none"><input id="lc" type="password" placeholder="Kode Pemain (rahasia)">
<input id="ln" placeholder="Nama (khusus pemain baru)"><input id="lk" placeholder="Kelas, mis. X-RPL (opsional)">
<button class="btn" style="width:100%;margin-top:8px" onclick="doLogin()">MASUK / DAFTAR</button></div>`}

// ===== NAVIGASI =====
async function go(v){S.view=v;paint();
  if(v==='home'||v==='quest'){const r=await call('quests');if(r){S.d.quests=r.quests;paint()}}
  if(v==='rank'){const r=await call('lb');if(r){S.lb=r;paint()}}
  if(v==='profile'){const r=await call('profile');if(r){S.prof=r;paint()}}
  if(v==='teacher'){const r=await call('teacher');if(r){S.teach=r;paint()}}}
function paint(){
  if(!S.d){$('#nav').innerHTML='';$('#app').innerHTML=loginV();return}
  const V={home:homeV,explore:exploreV,dex:dexV,battle:battleV,rank:rankV,quest:questV,profile:profV,teacher:teachV};
  const lob=S.view==='home';$('#nav').style.display=lob?'none':'';
  if(lob){$('#app').innerHTML=lobbyV();return}
  $('#app').innerHTML=hdr()+V[S.view]();
  const nav=NAV.slice();if(S.d.user.role!=='PLAYER')nav.push(['teacher','🧑‍🏫','GURU']);
  $('#nav').innerHTML=nav.map(n=>`<button class="${S.view===n[0]?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('')}
function hdr(){const u=S.d.user;return `<div class="hdr"><span class="logo">CODEVERSE</span><span><span class="chip">LV ${u.level}</span><span class="chip">🪙 ${u.coin}</span></span></div>`}
const xpBar=u=>`<div class="bar"><i style="width:${100*u.xpInto/u.xpNext}%"></i></div><small>XP ${u.xpInto} / ${u.xpNext}</small>`;
function rankBar(u){const r=u.rank;if(!r.next)return `<b>${r.name}</b><div class="bar"><i style="width:100%"></i></div>`;
  return `<b style="color:var(--gold);font-size:20px">${r.name}</b><div class="bar"><i style="width:${Math.max(0,r.rp-(r.next-100))}%"></i></div><small>${r.rp} / ${r.next}</small>`}

// ===== HOME =====
function homeV(){const u=S.d.user,dq=S.d.quests.filter(q=>q.type==='DAILY'),dn=dq.filter(q=>q.done).length,ev=S.d.event;
  return `<div class="card"><h2>Welcome, ${esc(u.name)}</h2>${xpBar(u)}</div>
${ev?`<div class="card" style="border-color:var(--gold)">🎉 <b>${ev.name}</b> — ${ev.desc}</div>`:''}
<div class="row"><div class="card"><small>RANK</small><br>${rankBar(u)}</div><div class="card"><small>DAILY QUEST</small><h2>${dn} / ${dq.length}</h2><small>complete</small></div></div>
<div class="card"><small>CURRENT SEASON</small><h2>${esc(S.d.season.name.toUpperCase())}</h2><small>${S.d.season.daysLeft} hari tersisa</small></div>
<div class="row"><button class="btn" onclick="go('explore')">🗺 EXPLORE</button><button class="btn m" onclick="go('battle')">⚔️ BATTLE</button></div>`}


// ===== LOBBY (tampilan home bergaya game) =====
const RO={Common:0,Uncommon:1,Rare:2,Epic:3,Legendary:4},RC=['#9ca3af','#39ff88','#3b9eff','#c15bff','#ffd24a'];
function lobbyV(){const u=S.d.user,o=S.d.owned,r=u.rank,ev=S.d.event,
  own=S.d.heroes.filter(h=>o[h.heroId]).sort((a,b)=>RO[b.rarity]-RO[a.rarity]||o[b.heroId]-o[a.heroId]),
  h=own.length?own[(S.sh||0)%own.length]:null,
  dq=S.d.quests.filter(q=>q.type==='DAILY'),dn=dq.filter(q=>q.done).length,cl=S.d.quests.filter(q=>q.done&&!q.claimed).length,
  st=r.next?Math.min(5,Math.floor(Math.max(0,r.rp-(r.next-100))/20)):5,
  ac=h?RC[RO[h.rarity]]:'#00e5ff',
  tab=(ic,t,v,bd)=>`<button onclick="go('${v}')"><span>${ic}</span>${t}${bd?`<u>${bd}</u>`:''}</button>`;
  return `<div class="lb"><div class="lbbg"></div>
  <div class="lt"><div class="pf" onclick="go('profile')"><div class="av">${esc((u.name||'?')[0]).toUpperCase()}</div><div><b>${esc(u.name)}</b><div class="xb"><i style="width:${100*u.xpInto/u.xpNext}%"></i></div></div><span class="lv">LV ${u.level}</span></div>
   <div class="cur"><span class="chip">🪙 ${u.coin}</span><button class="ib" onclick="go('quest')">🎯${cl?`<u>${cl}</u>`:''}</button><button class="ib" onclick="go('rank')">🏆</button>${u.role!=='PLAYER'?`<button class="ib" onclick="go('teacher')">🧑‍🏫</button>`:''}</div></div>
  <div class="lm"><div class="ls">
    <button class="sd" onclick="go('explore')"><span>🗺</span>EXPLORE</button>
    <button class="sd" onclick="go('quest')"><span>🎯</span>QUEST<small>${dn}/${dq.length} harian</small>${cl?`<u>${cl}</u>`:''}</button>
    ${ev?`<button class="sd ev" onclick="toast('${esc(ev.name)}: ${esc(ev.desc)}')"><span>🎉</span>EVENT<small>${esc(ev.name)}</small></button>`:''}
    <button class="sd" onclick="go('rank')"><span>🌌</span>SEASON<small>${esc(S.d.season.name)}<br>${S.d.season.daysLeft} hari</small></button></div>
   <div class="ctr">${h?`<div class="stage" style="--ac:${ac}" onclick="S.sh=(S.sh||0)+1;paint()"><div class="aura"></div><div class="hi">${hImg(h.heroId,'height:min(230px,32vh)')}</div><div class="ped"></div></div>
     <div class="np"><small style="color:${ac}">${h.rarity.toUpperCase()} · ${h.type} · ${h.role}</small><h2>${esc(h.name).toUpperCase()}</h2><small>LV ${o[h.heroId]} · ketuk hero untuk ganti</small></div>`
     :`<div class="stage" style="--ac:#00e5ff"><div class="aura"></div><div class="hi">❓</div></div><div class="np"><h2>BELUM ADA HERO</h2><small>Buka EXPLORE dan tangkap Hero pertamamu!</small></div>`}</div>
   <div class="rs"><div class="pn"><h4>MY SQUAD · ${own.length}/${S.d.heroes.length}</h4>${own.slice(0,4).map(x=>`<div class="sr" onclick="heroM('${x.heroId}')"><i>${hImg(x.heroId,'height:30px')}</i><b>${esc(x.name)}</b><small>LV ${o[x.heroId]}</small></div>`).join('')||'<small class="mut">Kosong</small>'}</div>
    <div class="pn"><h4>DAILY QUEST</h4><div class="bar"><i style="width:${dq.length?100*dn/dq.length:0}%"></i></div><small>${dn} / ${dq.length} selesai</small></div></div></div>
  <div class="tip">⚔️ Menangkan battle untuk naik rank & dapat reward season!</div>
  <div class="bt"><div class="t2">${tab('🗺','Explore','explore')}${tab('🦸','Codedex','dex')}${tab('🎯','Quest','quest',cl||'')}${tab('👤','Profile','profile')}</div>
   <button class="rk" onclick="go('battle')"><em>${'★'.repeat(st)+'☆'.repeat(5-st)}</em><b>BATTLE</b><small>${esc(r.name)}</small></button></div></div>`}

// ===== EXPLORE + CAPTURE =====
const POS={forest:[18,26],power:[62,16],fire:[84,46],ice:[24,66],crystal:[50,46],bug:[68,80]};
function exploreV(){const b=S.d.boss,Z=S.d.zones;
  return `<h3>🗺 Pilih titik sinyal</h3><div class="map">${Object.keys(Z).map(k=>`<button class="node" style="left:${POS[k][0]}%;top:${POS[k][1]}%" onclick="zone('${k}')">${Z[k].i}<small>${Z[k].n}</small></button>`).join('')}</div>
<div class="card" style="border-color:var(--c2)"><h3>👾 WEEKLY BOSS: ${b.name}</h3><div class="bar"><i style="width:${100*b.hp/b.max}%;background:linear-gradient(90deg,var(--c2),#ff7b7b)"></i></div><small>${b.hp} / ${b.max} HP — selesaikan challenge untuk memberi damage</small>
${b.hp>0?`<div class="row" style="margin-top:10px"><button class="btn m" onclick="boss('Variable')">Variable<br><small>500</small></button><button class="btn m" onclick="boss('Conditional')">IF/ELSE<br><small>700</small></button><button class="btn m" onclick="boss('Loop')">Loop<br><small>800</small></button><button class="btn m" onclick="boss('Debugging')">Debug<br><small>1000</small></button></div>`:'<h3 style="color:var(--ok)">BOSS DEFEATED!</h3>'}</div>`}
async function zone(z){const r=await call('explore',{zone:z});if(!r)return;S.tk=r.ticket;S.cur=r;
  if(r.kind==='hero')mod(`<div class="big">❓</div><h2 style="color:var(--c1)">⚡ CODE SIGNAL DETECTED!</h2><h3>UNKNOWN HERO</h3><p>Type: ${r.hero.type}<br>Rarity: ${r.hero.rarity}</p><br><button class="btn" onclick="showCh()">INVESTIGATE</button> <button class="btn" style="background:#222;color:#fff" onclick="closeM()">PERGI</button>`);
  else mod(`<div class="big">📦</div><h2 style="color:var(--c1)">MYSTERY BOX FOUND!</h2><p>Pecahkan kunci logikanya untuk membuka.</p><br><button class="btn" onclick="showCh()">INVESTIGATE</button> <button class="btn" style="background:#222;color:#fff" onclick="closeM()">PERGI</button>`)}
async function boss(t){const r=await call('boss',{topic:t});if(!r)return;S.tk=r.ticket;showCh()}
function showCh(msg){const t=S.tk;let head='';
  if(t.kind==='capture'){const h=S.cur.heroInfo;head=`<small>HERO DETECTED</small><h2>${hImg(h.heroId,'height:44px;vertical-align:middle')} ${h.name.toUpperCase()}</h2><small>Solve the challenge to capture this Hero.</small>`}
  else if(t.kind==='box')head='<h2>📦 MYSTERY BOX</h2>';else if(t.kind==='boss')head=`<h2>👾 ${S.d.boss.name}</h2>`;else head=`<h2>${S.ctx}</h2>`;
  mod(`${head}<div style="margin-top:8px"><span class="tag">${t.topic} · LV${t.difficulty}</span></div>${msg?`<p class="err">${msg}</p>`:''}<pre>${esc(t.question)}</pre>${t.options.map((o,i)=>`<button class="opt" onclick="pick(${i})">${esc(o)}</button>`).join('')}`)}
async function pick(i){document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const k=S.tk.kind,r=await call('answer',{ticketId:S.tk.ticketId,choice:i});if(!r){closeM();return}
  S.d.user=r.user;if(r.battle)S.b=r.battle;if(r.boss)S.d.boss=r.boss;
  const w=r.reward?`<div class="gain">+${r.reward.xp} XP &nbsp; +${r.reward.coin} COIN</div>`:'';
  if(r.correct){
    if(k==='capture'){S.d.owned[r.hero.heroId]=1;resM('✓ CORRECT','CAPTURE SUCCESS!',`${hImg(r.hero.heroId,'height:110px')}<br><b>${r.hero.name.toUpperCase()} HAS JOINED YOUR CODEDEX!</b>${w}`)}
    else if(k==='box')resM('✓ CORRECT','MYSTERY BOX OPENED!',w);
    else if(k==='boss')resM('✓ CORRECT',`⚔️ ${r.damage} DAMAGE!`,(r.boss.hp<=0?'<b>BOSS DEFEATED! REWARD UNLOCKED</b>':'')+w);
    else{closeM();toast('✓ SKILL ACTIVATED!');afterB()}
  }else{
    if(r.next){S.tk=r.next;showCh('✕ CODE ERROR — Try Again')}
    else{closeM();toast('✕ CODE ERROR');if(k==='skill')afterB();else paint()}}}

// ===== CODEDEX =====
const lvm=(v,l)=>Math.round(v*(1+.12*(l-1)));
function dexV(){const o=S.d.owned,n=Object.keys(o).length;
  return `<h3>🦸 MY CODEDEX <small>${n} / ${S.d.heroes.length}</small></h3><div class="grid">${S.d.heroes.map(h=>o[h.heroId]?
  `<div class="card hero r-${h.rarity}" onclick="heroM('${h.heroId}')"><div class="ic">${hImg(h.heroId,'height:64px')}</div><b>${h.name} ✓</b><br><small>${h.type} · ${h.role}<br>${h.rarity} · LV ${o[h.heroId]}</small></div>`:
  `<div class="card hero lock"><div class="ic">❓</div><b>${h.name} ?</b><br><small>${h.rarity}</small></div>`).join('')}</div>`}
function heroM(id){const h=H(id),l=S.d.owned[id];
  mod(`${hImg(h.heroId,'height:130px')}<h2>${h.name}</h2><span class="tag">${h.type}</span> <span class="tag">${h.rarity}</span> <span class="tag">${h.role}</span><p class="mut" style="margin:8px 0">${h.description}</p>
  <p>❤️ HP ${lvm(h.hp,l)} &nbsp; ⚔️ ATK ${lvm(h.attack,l)} &nbsp; 🛡 DEF ${lvm(h.defense,l)}</p><p style="margin:8px 0">Skill 1: <b>${h.skill1}</b><br>Skill 2: <b>${h.skill2}</b><br>Ultimate: <b>${h.ultimate}</b></p>
  <p>LEVEL ${l}</p><button class="btn" ${l>=10?'disabled':''} onclick="upg('${id}')">UPGRADE 🪙${l*60}</button> <button class="btn" style="background:#222;color:#fff" onclick="closeM()">TUTUP</button>`)}
async function upg(id){const r=await call('upgrade',{heroId:id});if(!r)return;S.d.user=r.user;S.d.owned[id]=r.level;heroM(id);paint()}

// ===== BATTLE REALTIME (MOBA) =====
// Hero digerakkan sendiri (joystick / WASD). Basic Attack bebas; Skill & Ultimate butuh jawab soal logika (game berhenti sejenak).
const RT={on:0};
const W=3600,HW=2200; // peta diperbesar (sebelumnya 1600x900)
const ROLE={Attack:{r:170,s:210},Support:{r:180,s:200},Tank:{r:85,s:170},Speed:{r:95,s:250},Control:{r:190,s:200},Controller:{r:190,s:200},Master:{r:150,s:220}};
const KIND={H1:['shot','dash','aoe'],H2:['heal','shot','aoe'],H3:['shield','aoe','aoe'],H4:['shot','dash','aoe'],H5:['shot','aoe','aoe'],H6:['shot','aoe','aoe'],H7:['shot','dash','aoe'],H8:['dash','shot','aoe']};
const KI={shot:'🔹',dash:'💨',aoe:'💥',heal:'💚',shield:'🛡️'};
const VIEW_H=380; // tinggi pandangan kamera dalam unit dunia (makin kecil = makin dekat ke hero)
// ---- PETA 3 LANE: base biru kiri-bawah, base merah kanan-atas ----
const BX=220,BY=2000,RX=W-BX,RY=HW-BY; // base biru & merah
const LN=[[[BX,BY],[BX,RY],[RX,RY]],[[BX,BY],[1000,1220],[W-1000,HW-1220],[RX,RY]],[[BX,BY],[RX,BY],[RX,RY]]]; // 0=atas(Gold) 1=tengah(Mid) 2=bawah(EXP)
const OB0=[[1720,1317,30,'t'],[1624,419,28,'r'],[778,610,28,'t'],[430,1394,36,'r'],[2227,1629,34,'t'],[438,782,36,'t'],[845,899,28,'t'],[2134,856,36,'t'],[2583,396,34,'t']];
const OBS=OB0.concat(OB0.map(o=>[W-o[0],HW-o[1],o[2],o[3]])); // jungle simetris
function lanePt(l,f){const p=LN[l],L=[];let tot=0;for(let i=1;i<p.length;i++){L.push(Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));tot+=L[i-1]}
  let d=f*tot;for(let i=0;i<L.length;i++){if(d<=L[i]||i===L.length-1){const k=d/L[i];return[p[i][0]+(p[i+1][0]-p[i][0])*k,p[i][1]+(p[i+1][1]-p[i][1])*k]}d-=L[i]}}
// 3 turret per lane per tim (n=0 terluar, n=2 terdalam). Turret hanya bisa dihancurkan berurutan dari luar.
const TD=[[2000,1400,800],[1600,1130,700],[2000,1400,800]]; // jarak turret dari base (px), n=0 terluar. Antar-lane >=580px, jangkauan turret 240
function laneLen(l){const p=LN[l];let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return s}
function mkTw(){const o=[];for(let l=0;l<3;l++){const LL=laneLen(l);for(let t=0;t<2;t++)TD[l].forEach((dd,n)=>{const f=dd/LL,q=lanePt(l,t?1-f:f);
  o.push({x:q[0],y:q[1],hp:600+n*100,max:600+n*100,t:t,lane:l,n:n,cd:Math.random()*1.5,rg:240,tw:1})})}return o}
// bisa diserang? hero selalu; turret jika turret luar di lane-nya sudah hancur; crystal jika ada turret terdalam yg hancur
function vul(t){if(t.id)return true;if(t.tw)return RT.tw.every(x=>x.t!==t.t||x.lane!==t.lane||x.n>=t.n||x.hp<=0);return RT.tw.some(x=>x.t===t.t&&x.n===2&&x.hp<=0)}
function sTargets(team){return[...RT.tw.filter(w=>w.t!==team&&w.hp>0),RT.cr[1-team]].filter(s=>s.hp>0&&vul(s))}
function sHit(u,R,d){sTargets(u.team).forEach(s=>{if(dist(u,s)<R)hurt(u,s,d)})}
// Hero AI takut turret/crystal musuh: hanya berani masuk jangkauan kalau >=2 minion timnya "menjadi umpan" & HP sehat
function tFear(u){const hr=u.hp/u.max;let b=null;
  RT.tw.forEach(w=>{if(w.t===u.team||w.hp<=0)return;const d=dist(u,w);if(d>w.rg+90)return;
    const tank=RT.mn.filter(m=>m.team===u.team&&!m.dead&&dist(m,w)<w.rg).length>=2;
    if(!(tank&&hr>.45)&&(!b||d<b.d))b={w:w,d:d,r:w.rg}});
  const c=RT.cr[1-u.team];if(c.hp>0){const d=dist(u,c);if(d<340&&!(vul(c)&&hr>.6)&&(!b||d<b.d))b={w:c,d:d,r:250}}
  return b}
// jarak titik ke garis lane (minion hanya melayani target yang ada di lane-nya)
function laneD(m,o){const p=LN[m.lane];let b=1e9;for(let i=1;i<p.length;i++){const ax=p[i-1][0],ay=p[i-1][1],dx=p[i][0]-ax,dy=p[i][1]-ay,k=clamp(((o.x-ax)*dx+(o.y-ay)*dy)/(dx*dx+dy*dy),0,1);b=Math.min(b,Math.hypot(o.x-ax-dx*k,o.y-ay-dy*k))}return b}
function lpts(u){const p=LN[u.lane];return u.team?p.slice().reverse():p}
function lanePush(u,dt){const p=lpts(u);while(u.wp<p.length-1&&Math.hypot(u.x-p[u.wp][0],u.y-p[u.wp][1])<70)u.wp++;
  if(u.wp>=p.length-1){const s=nearest(u,sTargets(u.team),1e9);if(s){toward(u,s,dt);return}}
  toward(u,{x:p[u.wp][0],y:p[u.wp][1]},dt)}

async function mpHost(){

  const mkp=()=>{MP.code=Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
    const p=new Peer('cvmabar-'+MP.code);MP.peer=p;
    p.on('open',()=>mpLobbyPush());
    p.on('error',e=>{if(e.type==='unavailable-id'){try{p.destroy()}catch(x){}mkp()}else{toast('Mabar error: '+e.type);if(!RT.on)closeM()}});
    p.on('connection',c=>{c.on('data',m=>mpHostMsg(c,m));c.on('close',()=>mpHostLeft(c))})};
  mkp()}
function mpLobbyPush(){if(MP.role!=='host'||RT.on)return;const n=mpNames();
  mpBroadcast({t:'lobby',p:n});
  mod(`<h3>👥 ROOM MABAR</h3><p class="mut">Bagikan kode ini ke teman (maks 3 pemain, sisanya AI):</p><div class="big" style="letter-spacing:8px;font-weight:900">${MP.code}</div>${mpList(n)}<br>
    <button class="btn m" onclick="mpCopy()">📋 BAGIKAN KODE</button><br><br><button class="btn" onclick="mpStart()">▶ MULAI (${n.length}/3 pemain)</button><br><br><button class="btn m" onclick="mpCancel()">BATAL</button>`)}
function mpCancel(){mpBroadcast({t:'closed'});setTimeout(()=>{mpReset()},300);closeM()}
function mpHostMsg(c,m){if(!m)return;
  if(m.t==='hello'){if(RT.on||MP.starting||MP.conns.length>=2||MP.conns.indexOf(c)>=0){try{c.send({t:'full'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400);return}
    c.pname=String(m.name||'Pemain').slice(0,20);MP.conns.push(c);mpLobbyPush();return}
  if(m.t==='ready'){MP.ready[c.peer]=m.unit||null;return}
  const u=RT.on&&RT.mp?RT.units.find(x=>x.rem===c.peer):null;if(!u)return;
  if(m.t==='in'){u.inp={x:clamp(+m.x||0,-1,1),y:clamp(+m.y||0,-1,1),a:m.a?1:0,t:performance.now()}}
  else if(m.t==='cast'){const i=m.i|0;if(i<1||i>3||u.dead||u.cd[i]>0||RT.over)return;
    RT.dm=clamp(+m.dm||1,.6,1.3);cast(u,i,m.a==null?null:+m.a);RT.dm=1;u.cd[i]*=clamp(+m.cd||1,.7,1)}
  else if(m.t==='buy'){buy(u,String(m.id))}else if(m.t==='ping'){try{c.send({t:'pong',ts:m.ts})}catch(e){}}else if(m.t==='chat'){mpChat(RT.units.indexOf(u),m.s)}
  else if(m.t==='bye')mpHostLeft(c)}
function mpHostLeft(c){const k=MP.conns.indexOf(c);if(k<0)return;MP.conns.splice(k,1);try{c.close()}catch(e){}
  if(RT.on&&RT.mp){const u=RT.units.find(x=>x.rem===c.peer);if(u){u.rem=null;u.inp=null;toast('👋 '+(c.pname||'Teman')+' keluar, digantikan AI')}}else mpLobbyPush()}

// ---- HOST: mulai match ----
async function mpStart(){if(MP.starting||RT.on)return;MP.starting=1;MP.ready={};const gs=MP.conns.slice();
  gs.forEach(c=>{try{c.send({t:'go'})}catch(e){}});mod('<h3>⚙️ Menyiapkan battle...</h3>');
  const r=await call('rtstart',{mode:'ai',team:S.team});if(!r){MP.starting=0;mpLobbyPush();return}S.d.user=r.user;
  const t0=Date.now();while(Date.now()-t0<10000&&gs.some(c=>c.open&&!(c.peer in MP.ready)))await new Promise(x=>setTimeout(x,200));
  const live=gs.filter(c=>c.open&&MP.ready[c.peer]);gs.filter(c=>live.indexOf(c)<0).forEach(c=>{try{c.close()}catch(e){}});MP.conns=live;
  const mine=[r.mine[0]].concat(live.map(c=>MP.ready[c.peer]));for(let i=1;mine.length<3;i++)mine.push(r.mine[i]);
  const pn=[S.d.user.name].concat(live.map(c=>c.pname||'Pemain'));
  closeM();MP.starting=0;
  rtInit({mine:mine,foe:r.foe,pool:r.pool,sid:r.sid});
  RT.mp={role:'host',conns:MP.conns,me:0,snapT:0};
  pn.forEach((n,i)=>RT.units[i].pname=n);
  live.forEach((c,i)=>{RT.units[i+1].rem=c.peer;try{c.send({t:'init',mine:mine,foe:r.foe,idx:i+1,pn:pn})}catch(e){}});
  mpWake();toast('👥 Mabar dimulai! Host: jangan tutup/pindah tab selama main')}

  RT.proj=m.pr.map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3],t:a[4],r:a[5],l:a[6],c:a[7]||null}));
  (m.fx||[]).forEach(f=>RT.fx.push(f));(m.tx||[]).forEach(f=>RT.txt.push(f))}
function gStep(dt){if(RT.qk)qaTick(dt);const k=Math.min(1,dt*14);
  RT.units.forEach(u=>{if(u.tx!=null){const e=Math.hypot(u.tx-u.x,u.ty-u.y),kk=u===cu()&&!u.dead?(e>90?1:Math.min(1,dt*(e>30?6:2.5))):k;u.x+=(u.tx-u.x)*kk;u.y+=(u.ty-u.y)*kk}for(let i=0;i<4;i++)if(u.cd[i]>0)u.cd[i]-=dt;u.atkT-=dt;u.castT-=dt;u.mv-=dt;if(u.mv>0)u.ph+=dt});
  RT.mn.forEach(m=>{if(m.tx!=null){m.x+=(m.tx-m.x)*k;m.y+=(m.ty-m.y)*k}m.mv-=dt;if(m.mv>0)m.ph+=dt});
  RT.proj.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt});RT.fx.forEach(f=>f.l-=dt);RT.fx=RT.fx.filter(f=>f.l>0);RT.txt.forEach(f=>f.l-=dt);RT.txt=RT.txt.filter(f=>f.l>0);
  const m=RT.mp,K=RT.keys;let dx=RT.joy.x+((K.d||K.arrowright)?1:0)-((K.a||K.arrowleft)?1:0),dy=RT.joy.y+((K.s||K.arrowdown)?1:0)-((K.w||K.arrowup)?1:0);
  {const me=cu(),mg=Math.hypot(dx,dy);if(!me.dead&&mg>.12){const q=mg>1?1/mg:1;move(me,dx*q,dy*q,dt);me.face=Math.atan2(dy,dx)}}
  m.pgT=(m.pgT||0)-dt;if(m.pgT<=0){m.pgT=2;mpSend({t:'ping',ts:performance.now()})}
  m.inT-=dt;if(m.inT<=0){m.inT=1/20;
    mpSend({t:'in',x:Math.round(dx*100)/100,y:Math.round(dy*100)/100,a:(RT.atk||K[' ']||K.j)?1:0})}}

// ===== QUEST =====
function questV(){const g=t=>S.d.quests.filter(q=>q.type===t).map(q=>`<div class="card"><b>${q.title}</b> <small>${q.description}</small><div class="bar"><i style="width:${100*q.progress/q.target}%"></i></div><div style="display:flex;justify-content:space-between;align-items:center"><small>${q.progress}/${q.target} · +${q.rewardXP} XP +${q.rewardCoin}🪙</small>${q.claimed?'<span class="tag">CLAIMED ✓</span>':`<button class="btn" ${q.done?'':'disabled'} onclick="claim('${q.questId}')">CLAIM</button>`}</div></div>`).join('');
  return `<h3>DAILY QUEST</h3>${g('DAILY')}<h3>WEEKLY QUEST</h3>${g('WEEKLY')}<h3>SPECIAL QUEST</h3>${g('SPECIAL')}`}
async function claim(id){const r=await call('claim',{questId:id});if(!r)return;S.d.user=r.user;S.d.quests=r.quests;
  if(r.hero){S.d.owned[r.hero.heroId]=1;resM('🎯 QUEST COMPLETE','LEGENDARY UNLOCKED!',`${hImg(r.hero.heroId,'height:110px')}<br><b>${r.hero.name.toUpperCase()}</b><div class="gain">+${r.reward.xp} XP +${r.reward.coin} COIN</div>`)}
  else{toast(`+${r.reward.xp} XP  +${r.reward.coin} COIN`);paint()}}

// ===== PROFILE + CODE DNA =====
const dnaBars=d=>Object.keys(d).filter(k=>d[k].n>0||['Algorithm','Variable','Conditional','Loop','Debugging','Logic'].includes(k)).map(k=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between"><span>${k}</span><b>${d[k].pct}%</b></div><div class="bar"><i style="width:${d[k].pct}%"></i></div></div>`).join('');
function profV(){const u=S.d.user,p=S.prof;
  return `<div class="card"><h2>${esc(u.name)} <small>@${esc(u.username)}${u.kelas?' · '+esc(u.kelas):''}</small></h2><span class="chip">LEVEL ${u.level}</span><span class="chip">${u.rank.name}</span><span class="chip">${u.role}</span>${xpBar(u)}</div>
  <div class="card"><h3>🧬 SKILL DNA</h3>${p?dnaBars(p.dna):'Memuat...'}</div>
  ${p?`<div class="card"><div class="row"><div><small>Challenge benar</small><h2>${p.stats.correct}/${p.stats.attempts}</h2></div><div><small>Battle menang</small><h2>${p.stats.wins}</h2></div><div><small>Hero</small><h2>${p.stats.heroes}</h2></div></div></div>`:''}
  <button class="btn m" style="width:100%" onclick="logout()">KELUAR</button>`}

// ===== TEACHER DASHBOARD =====
function teachV(){const t=S.teach;if(!t)return '<div class="card">Memuat...</div>';
  return `<h3>🧑‍🏫 TEACHER MODE</h3><div class="grid"><div class="card"><small>TOTAL PLAYERS</small><h2>${t.total}</h2></div><div class="card"><small>ACTIVE (7 hari)</small><h2>${t.active}</h2></div><div class="card"><small>AVG LOGIC SCORE</small><h2>${t.avg}%</h2></div><div class="card"><small>TOTAL CHALLENGES</small><h2>${t.challenges}</h2></div></div>
  <div class="card"><h3>CLASS PERFORMANCE</h3>${dnaBars(t.dna)}<small>Topik dengan persen terendah = konsep yang masih sulit.</small></div>
  <div class="card"><h3>TOP PLAYERS</h3>${t.top.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:5px 0">${i+1}. ${esc(x.name)} <small>${esc(x.kelas||'')}</small><b>LV ${x.level} · ${x.xp} XP</b></div>`).join('')||'Belum ada pemain'}</div>
  <div class="card"><h3>➕ Challenge Baru</h3><input id="ct" placeholder="Judul"><select id="cp"><option>Algorithm</option><option>Variable</option><option>Conditional</option><option>Loop</option><option>Debugging</option><option>Logic</option><option>Fisika</option><option>Kimia</option><option>Biologi</option><option>Matematika</option><option>B.Indonesia</option><option>B.Inggris</option><option>Geografi</option><option>Sejarah</option></select>
  <select id="cd"><option value="1">Level 1 (mudah)</option><option value="2">Level 2</option><option value="3">Level 3 (sulit)</option></select><textarea id="cq" rows="3" placeholder="Soal / kode"></textarea>
  <input class="co" placeholder="Opsi A (jawaban BENAR)"><input class="co" placeholder="Opsi B"><input class="co" placeholder="Opsi C"><input class="co" placeholder="Opsi D"><textarea id="cx" rows="2" placeholder="Penjelasan jawaban (tampil di Review)"></textarea><button class="btn" onclick="addCh()">SIMPAN CHALLENGE</button></div>
  <div class="card"><h3>🗓 Season Baru</h3><input id="sn" placeholder="Nama season, mis. Return of the Machines"><input id="sd" type="number" placeholder="Durasi (hari)" value="30"><button class="btn m" onclick="newS()">MULAI SEASON BARU</button></div>`}
async function addCh(){const o=[...document.querySelectorAll('.co')].map(x=>x.value.trim());
  const r=await call('addChallenge',{title:$('#ct').value,topic:$('#cp').value,difficulty:$('#cd').value,question:$('#cq').value,options:o,answer:0,explanation:$('#cx').value});if(r)toast('Challenge tersimpan ✓')}
async function newS(){if(!confirm('Akhiri season sekarang dan mulai yang baru?'))return;const r=await call('newSeason',{name:$('#sn').value,days:$('#sd').value});if(r){S.d.season=r.season;toast('Season baru dimulai')}}

// ===== START =====
(async()=>{if(S.token){const r=await call('me');if(r){S.d=r;return go('home')}}paint()})();
</script></body></html>
